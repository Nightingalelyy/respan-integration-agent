[project]
name = "respan-integration-agent"
version = "0.0.1"
description = "Respan onboarding agent — produces validated integration patches and dogfoods Respan tracing and gateway"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic==2.13.4",
  "claude-agent-sdk==0.2.143",
  "respan-ai==4.1.0",
  "respan-instrumentation-claude-agent-sdk==0.2.0",
  "opentelemetry-claude-agent-sdk==0.1.4",
]

[project.scripts]
respan-integration-agent = "respan_integration_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.12.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/respan_integration_agent"]
